# ─────────────────────────────────────────────────────────────────────────────
# CI del Frontend (Next.js)
# Se ejecuta en cada push a dev, test y main (prod).
# Verifica lint, tipos, tests y que el build compile sin errores.
# ─────────────────────────────────────────────────────────────────────────────
name: Frontend CI

on:
  push:
    branches: [dev, test, main]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [dev, test, main]
    paths:
      - 'frontend/**'

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Tests (Vitest)
        run: npm test

      - name: Build
        # Las variables de entorno de Supabase son necesarias para el build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
