name: Supabase keepalive

# El plan Free de Supabase pausa el proyecto tras 7 días sin actividad y la app
# deja de abrir. Una consulta cada 3 días cuenta como actividad.
# Usa la anon key y una RPC pública de solo lectura (no lee datos de nadie).
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/is_company_slug_available" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_slug":"keepalive-ping"}'
