spring:
  application:
    name: backoffice-bocha

  datasource:
    # Conecta a la base de datos PostgreSQL de Supabase (o local vía Docker)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bocha}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'none' en producción: Hibernate no toca ni valida el schema
      # El schema lo maneja Supabase directamente
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false  # Buena práctica: evitar LazyInitializationException silenciosas

server:
  port: ${PORT:8080}

# Configuración de Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

# Actuator — solo exponer health públicamente
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# CORS: permite peticiones desde el frontend Next.js
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhos